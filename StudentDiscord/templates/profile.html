<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ current_user.username }} - Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #313338;
            color: white;
            font-family: Arial, sans-serif;
        }

        .profile-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 500px;
            background: #2b2d31;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }

        .profile-banner {
            height: 120px;
            background: linear-gradient(
                135deg,
                #5865f2,
                #7289da
            );
        }

        .profile-content {
            padding: 0 30px 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin-top: -45px;
            border-radius: 50%;
            background: #5865f2;
            border: 6px solid #2b2d31;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;
            font-weight: bold;
        }

        .username {
            margin-top: 15px;
            font-size: 25px;
            font-weight: bold;
        }

        .student-label {
            color: #949ba4;
            font-size: 13px;
        }

        .info-box {
            background: #1e1f22;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .info-title {
            color: #949ba4;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            color: #dbdee1;
            word-break: break-word;
        }

        .online {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #23a559;
            margin-right: 6px;
        }

        .back-button {
            margin-top: 20px;
        }

    </style>

</head>


<body>

<div class="profile-wrapper">

    <div class="profile-card">

        <div class="profile-banner"></div>

        <div class="profile-content">

            <!-- AVATAR -->

            <div class="avatar">

                {{ current_user.username[0]|upper }}

            </div>


            <!-- USERNAME -->

            <div class="username">

                {{ current_user.username }}

            </div>


            <div class="student-label">

                <span class="online"></span>

                Student

            </div>


            <!-- EMAIL -->

            <div class="info-box">

                <div class="info-title">

                    Email

                </div>

                <div class="info-value">

                    {{ current_user.email }}

                </div>

            </div>


            <!-- USER ID -->

            <div class="info-box">

                <div class="info-title">

                    Student ID

                </div>

                <div class="info-value">

                    #{{ current_user.id }}

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="d-grid gap-2 back-button">

                <a
                    href="{{ url_for('home') }}"
                    class="btn btn-primary">

                    ← Back to Dashboard

                </a>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-outline-light">

                    Logout

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
